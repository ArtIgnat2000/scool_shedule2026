<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>📚 Расписание 3Б класса</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --header-bg: #87CEEB;
            --header-border: #5F9EA0;
            --primary-color: #4a90e2;
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, 'Noto Sans', sans-serif;
            background: linear-gradient(180deg, #B0E2FF 0%, #87CEEB 30%, #87CEEB 70%, #4A90E2 100%);
            color: #333;
            margin: 0;
            padding: 10px;
            line-height: 1.5;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            filter: blur(15px);
            z-index: -1;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .cloud:nth-child(1) { width: 120px; height: 50px; top: 8%; left: 5%; animation: float 25s infinite ease-in-out; }
        .cloud:nth-child(2) { width: 180px; height: 70px; top: 20%; right: 10%; animation: float 30s infinite ease-in-out reverse; }
        .cloud:nth-child(3) { width: 150px; height: 60px; bottom: 30%; left: 15%; animation: float 35s infinite ease-in-out; }
        .cloud:nth-child(4) { width: 200px; height: 80px; top: 35%; right: 20%; animation: float 40s infinite ease-in-out reverse; }
        .cloud:nth-child(5) { width: 100px; height: 40px; bottom: 15%; right: 25%; animation: float 28s infinite ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(10px, 15px); }
            50% { transform: translate(20px, 0); }
            75% { transform: translate(10px, -15px); }
        }

        header {
            text-align: center;
            background-color: var(--header-bg);
            color: white;
            padding: 12px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            position: relative;
            border: 2px solid var(--header-border);
        }

        h1 { margin: 0; font-size: 1.8rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }

        .meal-link-container { margin-top: 10px; }

        .meal-link {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #4A90E2, #5F9EA0);
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid white;
            position: relative;
            overflow: hidden;
            margin: 0 5px;
        }

        .meal-link:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #357ABD, #4682B4);
        }

        .upload-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            border: 2px dashed white;
        }

        .upload-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #333;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #fileInput { display: none; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 16px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 100px;
            white-space: nowrap;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        button.active { background-color: var(--primary-color); transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        button:nth-child(1) { background-color: #ff6b6b; }
        button:nth-child(2) { background-color: #4ecdc4; }
        button:nth-child(3) { background-color: #45b7d1; }
        button:nth-child(4) { background-color: #96ceb4; }
        button:nth-child(5) { background-color: #f9cb9c; }

        .schedule {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid var(--header-border);
        }

        .schedule.show { display: block; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 5px rgba(0,0,0,0.05);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 8px;
            font-size: 0.95rem;
            text-align: left;
        }

        th {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            font-weight: bold;
            text-align: center;
        }

        th:first-child, td:first-child { text-align: center; width: 40px; }
        tr:nth-child(even) { background-color: #f0f4f8; }
        tr:hover { background-color: #e9f5ff; }

        .info-text {
            background: #fff3cd;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ffc107;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.8rem;
            padding: 8px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            header { padding: 10px 8px; }
            h1 { font-size: 1.5rem; }
            .meal-link { padding: 8px 16px; font-size: 1rem; }
            .container { padding: 12px; }
            .buttons { gap: 6px; margin-bottom: 15px; }
            button { padding: 10px 12px; font-size: 0.85rem; min-width: 85px; }
            th, td { padding: 8px 6px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

    <header>
        <h1>📚 Расписание 3 «Б»</h1>
        <div class="meal-link-container">
            <a href="https://artignat2000.github.io/meal-schedule/" class="meal-link">🍽️ ЕДА</a>
            <a href="https://artignat2000.github.io/RaspisCanicyl/" class="meal-link">🌴 КАНИКУЛЫ</a>
            <a href="https://artignat2000.github.io/DopSchedule/" class="meal-link">💡 ДОП</a>
        </div>
        
        <!-- Секция загрузки файла -->
        <div class="upload-section">
            <p style="margin: 0 0 10px 0; font-size: 0.95rem;">📄 Загрузить расписание из текстового файла</p>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                📁 Выбрать файл
            </button>
            <input type="file" id="fileInput" accept=".txt,.text" onchange="handleFileUpload(event)">
            <p style="margin: 10px 0 0 0; font-size: 0.8rem; opacity: 0.9;">
                Формат: ПН|1|8:30-9:10|Математика или свободный текст
            </p>
        </div>
    </header>

    <div class="container">
        <div class="info-text">
            💡 <strong>Совет:</strong> Можно загрузить текстовый файл с расписанием или использовать стандартное расписание ниже
        </div>

        <div class="buttons">
            <button onclick="showDay('pn')" class="active">Пн</button>
            <button onclick="showDay('vt')">Вт</button>
            <button onclick="showDay('sr')">Ср</button>
            <button onclick="showDay('cht')">Чт</button>
            <button onclick="showDay('pt')">Пт</button>
        </div>

        <!-- Контейнеры для расписания (будут заполняться динамически) -->
        <div id="pn" class="schedule show"></div>
        <div id="vt" class="schedule"></div>
        <div id="sr" class="schedule"></div>
        <div id="cht" class="schedule"></div>
        <div id="pt" class="schedule"></div>
    </div>

    <footer>&copy; 2025</footer>

    <script>
        // Стандартное расписание по умолчанию
        const defaultSchedule = {
            pn: [
                ['1', '8:30–9:10', '🧮 Математика'],
                ['2', '9:30–10:10', '📖 Рус.язык'],
                ['3', '10:20–11:00', '🌍 Окр.мир'],
                ['4', '11:20–12:00', '🌳 ПРОГУЛКА'],
                ['5', '12:20–13:00', '📚 Чтение'],
                ['6', '13:10–13:50', '🎮 Развивающие игры'],
                ['7', '14:00–14:40', '👩‍🏫 Классный час']
            ],
            vt: [
                ['1', '8:30–9:10', '🌐 Анг/Математика'],
                ['2', '9:30–10:10', '🧮 Математика/Анг'],
                ['3', '10:20–11:00', '🎵 Музыка'],
                ['4', '11:20–12:00', '📖 Рус.яз.'],
                ['5', '12:20–13:00', '🌳 ПРОГУЛКА'],
                ['6', '13:10–13:50', '🏃 ФИЗКУЛЬТУРА'],
                ['7', '14:00–14:40', '📝 СП']
            ],
            sr: [
                ['1', '8:30–9:10', '📖 Рус.язык'],
                ['2', '9:30–10:10', '🧮 Матем'],
                ['3', '10:20–11:00', '📚 Чтение'],
                ['4', '11:20–12:00', '🌳 ПРОГУЛКА'],
                ['5', '12:20–13:00', '🎨 ИЗО'],
                ['6', '13:10–13:50', '🌍 Окр.мир'],
                ['7', '14:00–14:40', '📝 СП']
            ],
            cht: [
                ['1', '8:30–9:10', '📖 Рус.язык'],
                ['2', '9:30–10:10', '🧮 Матем'],
                ['3', '10:20–11:00', '📚 Чтение'],
                ['4', '11:20–12:00', '🌳 ПРОГУЛКА'],
                ['5', '12:20–13:00', '🏃 ФИЗКУЛЬТУРА'],
                ['6', '13:10–13:50', '🔧 Технология'],
                ['7', '14:00–14:40', '💻 В мире информации']
            ],
            pt: [
                ['1', '8:30–9:10', '📖 Рус.язык'],
                ['2', '9:30–10:10', '🧮 Матем'],
                ['3', '10:20–11:00', '📚 Чтение'],
                ['4', '11:20–12:00', '🌊 Бассейн'],
                ['5', '12:20–13:00', '🌐 Анг/ИТ'],
                ['6', '13:10–13:50', '💻 ИТ/Анг'],
                ['7', '14:00–14:40', '🌳 ПРОГУЛКА']
            ]
        };

        // Инициализация при загрузке страницы
        window.onload = function() {
            renderSchedule(defaultSchedule);
        };

        // Обработка загрузки файла
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseAndRenderSchedule(text);
            };
            reader.readAsText(file);
        }

        // Парсинг текста и создание расписания
        function parseAndRenderSchedule(text) {
            const schedule = {
                pn: [],
                vt: [],
                sr: [],
                cht: [],
                pt: []
            };

            const lines = text.split('\n');
            let currentDay = null;

            // Маппинг дней недели
            const dayMap = {
                'ПН': 'pn', 'ПОНЕДЕЛЬНИК': 'pn',
                'ВТ': 'vt', 'ВТОРНИК': 'vt',
                'СР': 'sr', 'СРЕДА': 'sr',
                'ЧТ': 'cht', 'ЧЕТВЕРГ': 'cht',
                'ПТ': 'pt', 'ПЯТНИЦА': 'pt'
            };

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // Проверяем, является ли строка заголовком дня
                const upperLine = line.toUpperCase();
                for (const [key, value] of Object.entries(dayMap)) {
                    if (upperLine.includes(key)) {
                        currentDay = value;
                        return;
                    }
                }

                // Если текущий день определён, парсим урок
                if (currentDay) {
                    const lesson = parseLessonLine(line);
                    if (lesson) {
                        schedule[currentDay].push(lesson);
                    }
                }
            });

            // Проверяем, есть ли данные в распарсенном расписании
            const hasData = Object.values(schedule).some(day => day.length > 0);
            
            if (hasData) {
                renderSchedule(schedule);
                alert('✅ Расписание успешно загружено!');
            } else {
                alert('❌ Не удалось распознать расписание. Проверьте формат файла.');
            }
        }

        // Парсинг одной строки урока
        function parseLessonLine(line) {
            // Формат 1: НОМЕР|ВРЕМЯ|ПРЕДМЕТ
            const pipeFormat = line.split('|');
            if (pipeFormat.length === 3) {
                return [pipeFormat[0].trim(), pipeFormat[1].trim(), pipeFormat[2].trim()];
            }

            // Формат 2: НОМЕР. ВРЕМЯ ПРЕДМЕТ
            const dotMatch = line.match(/^(\d+)\.\s*(\d+:\d+[–-]\d+:\d+)\s+(.+)$/);
            if (dotMatch) {
                return [dotMatch[1], dotMatch[2], dotMatch[3]];
            }

            // Формат 3: Просто номер и предмет (время берём по умолчанию)
            const simpleMatch = line.match(/^(\d+)\.\s*(.+)$/);
            if (simpleMatch) {
                const times = ['8:30–9:10', '9:30–10:10', '10:20–11:00', '11:20–12:00', 
                              '12:20–13:00', '13:10–13:50', '14:00–14:40'];
                const num = parseInt(simpleMatch[1]) - 1;
                const time = times[num] || '???';
                return [simpleMatch[1], time, simpleMatch[2]];
            }

            return null;
        }

        // Отрисовка расписания
        function renderSchedule(schedule) {
            const days = ['pn', 'vt', 'sr', 'cht', 'pt'];
            
            days.forEach(day => {
                const container = document.getElementById(day);
                const lessons = schedule[day];
                
                if (lessons.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #999;">Нет уроков</p>';
                    return;
                }

                let html = '<table><tr><th>№</th><th>Время</th><th>Урок</th></tr>';
                lessons.forEach(lesson => {
                    html += `<tr><td>${lesson[0]}</td><td>${lesson[1]}</td><td>${lesson[2]}</td></tr>`;
                });
                html += '</table>';
                
                container.innerHTML = html;
            });
        }

        // Переключение дней
        function showDay(day) {
            document.querySelectorAll('.buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`button[onclick="showDay('${day}')"]`).classList.add('active');
            
            document.querySelectorAll('.schedule').forEach(schedule => {
                schedule.classList.remove('show');
            });
            document.getElementById(day).classList.add('show');
        }

        // Обработчики для ссылок
        document.querySelectorAll('.meal-link').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                const url = this.getAttribute('href').trim();
                window.location.href = url;
            });
        });
    </script>
</body>
</html>
